name: Verify job workspace checkpoint

on:
  pull_request:
  push:
    branches: ['codex/job-workspace-implementation']

permissions:
  contents: read

jobs:
  local-runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install application and offline test dependencies
        run: python -m pip install . -r requirements-dev.txt
      - name: Run full synthetic and legacy suite
        run: python -m unittest discover -s tests
      - name: Verify release specification
        run: python tools/check_release_plan.py
      - name: Check tracked credentials
        run: python scripts/check_no_secrets.py
      - name: Build installable wheel
        run: python -m pip wheel . --no-deps --wheel-dir testing/wheels
