[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwork-jobs"
version = "0.1.39"
description = "Local, evidence-first job workspace (development checkpoint)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
render = ["reportlab==5.1.0"]
render-test = ["reportlab==5.1.0", "pypdf==6.21.4", "pypdfium2==4.30.0"]
visual = ["pypdfium2==4.30.0"]

[project.scripts]
jw = "jw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
